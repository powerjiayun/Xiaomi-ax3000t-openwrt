name: Build OpenWrt  # 工作流名称：构建 OpenWrt

permissions:
  contents: write

on:
  schedule:
    # 每周日 UTC 00:00 触发（= 北京时间 08:00）
    - cron: "0 0 * * 0"
  repository_dispatch:  # 当收到 repository_dispatch 事件时触发
  workflow_dispatch:    # 允许手动触发工作流
    inputs:
      ssh:
        description: 'SSH 连接到 Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default  # 自定义 feeds 配置文件
  CONFIG_FILE: .config  # 配置文件
  DIY_P1_SH: diy-part1.sh  # 自定义脚本 1
  DIY_P2_SH: diy-part2.sh  # 自定义脚本 2
  UPLOAD_BIN_DIR: false  # 是否上传 bin 目录
  UPLOAD_FIRMWARE: true  # 是否上传固件
  UPLOAD_COWTRANSFER: false  # 是否上传到 cowtransfer
  UPLOAD_WETRANSFER: false  # 是否上传到 WeTransfer
  UPLOAD_RELEASE: true  # 是否发布 release
  TZ: Asia/Shanghai  # 时区设置

jobs:
  build:
    runs-on: ubuntu-22.04  # 运行环境为 Ubuntu 22.04

    steps:
    - name: Check Server Performance  # 检查服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Checkout  # 检出代码
      uses: actions/checkout@main

    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
        genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
        python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
        swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load custom feeds  # 加载自定义 feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds  # 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Upgrade Go toolchain for Hysteria 2.10
      run: |
        cd openwrt
        # Hysteria 2.10.0 要求 Go >= 1.25。这里固定使用仍提供 golang/host 的单包 Go 1.25.6，
        # 避免新版多版本 feed 的 golang1.25/host 无法被当前 24.10 feeds 安装器注册。
        GO_FEED_COMMIT=dbaeeb38d3df5f7b8c78ff23e558d2eab5b0a895
        rm -rf /tmp/immortalwrt-golang feeds/packages/lang/golang
        git init -q /tmp/immortalwrt-golang
        git -C /tmp/immortalwrt-golang remote add origin https://github.com/immortalwrt/packages.git
        git -C /tmp/immortalwrt-golang sparse-checkout init --cone
        git -C /tmp/immortalwrt-golang sparse-checkout set lang/golang
        git -C /tmp/immortalwrt-golang fetch --depth=1 origin "$GO_FEED_COMMIT"
        git -C /tmp/immortalwrt-golang checkout --detach FETCH_HEAD
        cp -a /tmp/immortalwrt-golang/lang/golang feeds/packages/lang/golang
        grep -q '^GO_VERSION_MAJOR_MINOR:=1.25$' feeds/packages/lang/golang/golang/Makefile
        grep -q '^GO_VERSION_PATCH:=6$' feeds/packages/lang/golang/golang/Makefile
        grep -q '^PKG_BUILD_DEPENDS:=golang/host$' feeds/packages/lang/golang/golang/Makefile
        test ! -d feeds/packages/lang/golang/golang1.25

    - name: Install feeds  # 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a
        grep -q '^GO_VERSION_MAJOR_MINOR:=1.25$' package/feeds/packages/golang/Makefile
        grep -q '^PKG_BUILD_DEPENDS:=golang/host$' package/feeds/packages/golang/Makefile

    - name: Install PassWall 1 with Hysteria 2 only
      run: |
        cd openwrt
        # 使用 PassWall 官方维护的依赖版本，避免与 OpenWrt feeds 的同名核心冲突。
        # hysteria 软件包提供 Hysteria 2 核心；其他代理核心虽在仓库中存在，但不会被 .config 选中。
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        rm -rf feeds/luci/applications/luci-app-passwall
        rm -rf package/passwall-packages package/passwall-luci
        git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
        git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
        # 固定 Hysteria 2.10.0 及其官方源码校验值，配合上面的 Go 1.25.6 工具链构建。
        sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=2.10.0/' package/passwall-packages/hysteria/Makefile
        sed -i 's/^PKG_HASH:=.*/PKG_HASH:=2c629f1ee327841c0288c9662fddc663eb53f3c76922b4660421a474cdb6e1f8/' package/passwall-packages/hysteria/Makefile

    - name: Install ddns-go
      run: |
        cd openwrt
        rm -rf package/ddns-go
        git clone https://github.com/sirpdboy/luci-app-ddns-go.git package/ddns-go


    - name: Install luci-app-tailscale
      run: |
        cd openwrt
        # 官方要求：移除 feeds 里 tailscale 默认启动脚本与配置，避免与 luci-app-tailscale 冲突
        if [ -f feeds/packages/net/tailscale/Makefile ]; then
          sed -i '/\/etc\/init\.d\/tailscale/d;/\/etc\/config\/tailscale/d;' feeds/packages/net/tailscale/Makefile
        fi
        rm -rf package/luci-app-tailscale
        git clone --depth=1 https://github.com/asvow/luci-app-tailscale.git package/luci-app-tailscale

   # - name: Install argon
      #run: |
        #cd openwrt/package/lean
        #rm -rf luci-theme-argon
        #git clone -b master https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon

    - name: Load custom configuration  # 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions  # 连接到 Actions 的 SSH
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package  # 下载包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc) || make download -j1 || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware  # 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_xiaomi_mi-router-ax3000t" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage  # 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory  # 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files  # 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory  # 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag  # 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

       
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove old Releases  # 删除旧的发布版本
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
